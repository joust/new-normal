<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width">
    <meta name="google" content="notranslate">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <link rel="apple-touch-icon" href="styles/images/nn-icon.png">
    <link rel="icon" type="image/png" href="styles/images/nn-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles/opensans.css">
    <link rel="stylesheet" href="styles/crocodile.css">
    <link rel="stylesheet" href="styles/style.css">

    <link rel="stylesheet" href="styles/theme.css">
    <title>New Normal</title>
    <script src="libs/html5-dragdroptouch-shim.mjs" type="module"></script>
    <script type="module">
      import { defineElements } from './define.mjs'
      import './modules/main.mjs'
      defineElements()
    </script>
  </head>
  <body onload="dragdrop(); flagcheck(); load()" class="notranslate black-white" translate="no">
    <div><button id="stop" class="hidden">&#x274c;</button></div>
    <select id="theme" class="hidden">
      <option title="Black/White" selected value="black-white">⚫⚪</option>
      <option title="Red/Blue Pill" value="red-blue-pill">🔴🔵</option>
      <option title="Green/Right" value="good-evil">🟤🟢</option>
    </select>
    <div id="menu" class="hidden">
      <div class="game-logo menu">
        <div class="logo">
          <span class="red">New N</span><span class="jump virus" onclick="event.target.classList.toggle('jump')"></span><span class="blue">rmal</span>
          <locale-selector class="location" languages="de,it,fr,da,en,pl,es,pt,nl"></locale-selector>
        </div>
      </div>
      <div class="content"></div>
    </div>
    <uno-game id="uno" class="hidden"></uno-game>
    <test-game id="test" class="hidden"></test-game>
    <bingo-game id="bingo" class="hidden"></bingo-game>

    <div id="content" class="hidden"></div>
    <div id="loader" class="hidden"></div>
  </body>
</html>
