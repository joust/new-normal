<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width">
    <meta name="google" content="notranslate">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>New Normal - Topic Manager</title>
    <link rel="stylesheet" href="styles/opensans.css">
    <link rel="stylesheet" href="styles/crocodile.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        topic-manager {
            display: block;
            height: 100%;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            background: #f0f2f5;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 1.5em;
            font-weight: bold;
        }
        .red { color: #dc3545; }
        .blue { color: #007bff; }
    </style>
</head>
<body class="notranslate" translate="no">
    <div class="header">
        <div class="logo">
            <span class="red">New</span>&nbsp;<span class="blue">Normal</span>
        </div>
        <h1>Topic Manager</h1>
    </div>
    <topic-manager></topic-manager>
    <script type="module">
        import './components/topic-manager.mjs';

        async function loadData() {
            try {
                const response = await fetch('/content/pandemic/data.json');
                const data = await response.json();
                
                const manager = document.querySelector('topic-manager');
                if (manager) {
                    manager.loadData(data);
                } else {
                    console.error('Topic manager element not found');
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Load data when the page loads
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
